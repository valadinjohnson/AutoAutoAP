# Cloudflare Worker holding the submission collector and the leaderboard page.
#
#   wrangler kv namespace create SUBMISSIONS   # paste the printed id below
#   wrangler deploy
#
# Then build the app with VITE_SUBMIT_URL=https://<worker>.workers.dev/submit so the panel's
# Submit button has somewhere to go. Without it the panel hides the button entirely and offers
# the save-a-file path instead, which is the correct default for a fork nobody has configured.

name = "ascension-chain-collector"
main = "worker.js"
compatibility_date = "2026-01-01"

# A KV namespace id is an identifier, not a credential -- it is useless without an authenticated
# session on the account that owns it, which is why Cloudflare's own examples commit it. Created
# with `wrangler kv namespace create SUBMISSIONS`.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "77c966d5ec964cc2979f59a190737fd4"

# NO R2 BINDING, DELIBERATELY. A run's CSV is gzipped in the browser before it is sent -- 15.3 MB
# of chain table measures 0.66 MB compressed -- so it fits KV's 25 MB per-value limit and lives
# under `csv:<id>` in the namespace above. R2 would mean a payment method on the account for a
# payload that does not need it. See collector/README.md for the tradeoff this makes on the
# player-id sweep.
