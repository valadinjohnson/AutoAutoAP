# Cloudflare Worker holding the submission collector and the leaderboard page.
#
#   wrangler kv namespace create SUBMISSIONS   # paste the printed id below
#   wrangler deploy
#
# Then build the app with VITE_SUBMIT_URL=https://<worker>.workers.dev/submit so the panel's
# Submit button has somewhere to go. Without it the panel hides the button entirely and offers
# the save-a-file path instead, which is the correct default for a fork nobody has configured.

name = "ascension-chain-collector"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# OPTIONAL. Only needed if you want players to be able to attach the full CSV of a run --
# every chain priced, one row per leg, a few megabytes each. Without this binding the /csv
# endpoint answers 501 and the app reports "the CSV was refused" while still counting the
# submission itself as sent.
#
#   wrangler r2 bucket create ascension-chain-csvs
#
# [[r2_buckets]]
# binding = "CSVS"
# bucket_name = "ascension-chain-csvs"
